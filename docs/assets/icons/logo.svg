<?xml version="1.0" encoding="UTF-8"?>
<!--
  Docsy inlines this file into the navbar of every page (upstream partial
  layouts/partials/navbar.html) and prints the site title right next to it.
  It therefore has to be the mascot alone, not the full lockup: the wordmark
  version rendered the name a second time beside the title, and squeezed into
  the 32px navbar slot the dragon became unreadable.
  The mascot is referenced rather than base64-embedded on purpose. This markup
  is inlined into every single page, so an embedded copy would add its weight
  to each one; as a reference the browser fetches and caches it once.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 177 200" width="177" height="200" role="img" aria-label="BOMHort">
  <image href="/images/bomhort-mascot-header.png"
         xlink:href="/images/bomhort-mascot-header.png"
         x="0" y="0" width="177" height="200"/>
</svg>
