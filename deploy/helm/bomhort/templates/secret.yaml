{{- if not .Values.clickhouse.userPasswordSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | b64enc | quote }}
  GITHUB_TOKEN: {{ .Values.github.token | b64enc | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | b64enc | quote }}
{{- end }}
{{- /*
  Separate Secret for API auth so it can be rotated independently of the
  ClickHouse/GitHub/S3 credentials and so the UI Deployment can reference it
  without pulling in unrelated secrets. Only created when auth.enabled=true
  and the user is not bringing their own existing Secret.
*/}}
{{- if and .Values.apiGateway.auth.enabled (not .Values.apiGateway.auth.existingSecret.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-auth
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  SERVICE_TOKEN: {{ .Values.apiGateway.auth.serviceToken | b64enc | quote }}
  {{- if kindIs "slice" .Values.apiGateway.auth.apiKeys }}
  API_KEYS:      ""
  API_KEYS_JSON: {{ .Values.apiGateway.auth.apiKeys | toJson | b64enc | quote }}
  {{- else }}
  API_KEYS:      {{ .Values.apiGateway.auth.apiKeys | default "" | b64enc | quote }}
  API_KEYS_JSON: ""
  {{- end }}
{{- end }}
{{- /*
  The MCP server's *inbound* bearer token (#399), separate again: it guards a
  different surface (tool execution) than the API keys do (read endpoints), so
  rotating one must not force rotating the other. Only created for the http
  transport — stdio has nothing to authenticate, because nothing is listening.
*/}}
{{- if and .Values.mcp.enabled (eq .Values.mcp.transport "http") (not .Values.mcp.existingSecret.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mcp-auth
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  MCP_HTTP_TOKEN: {{ .Values.mcp.httpToken | b64enc | quote }}
{{- end }}
