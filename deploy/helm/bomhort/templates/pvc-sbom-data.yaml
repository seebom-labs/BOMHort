{{- include "bomhort.sbomSource.validate" . }}
{{- if include "bomhort.sbomSource.pvc" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.sbomSource.pvcName }}
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - {{ .Values.sbomSource.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.sbomSource.storageSize | default "1Gi" }}
{{- end }}

