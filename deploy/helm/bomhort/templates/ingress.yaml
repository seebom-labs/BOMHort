{{- if .Values.ingress.enabled }}
{{- $authEnabled := .Values.apiGateway.auth.enabled | default false }}
{{- $uiIngress := false }}
{{- range .Values.ingress.hosts }}
  {{- range .paths }}
    {{- if eq (.serviceSuffix | default "api-gateway") "ui" }}
      {{- $uiIngress = true }}
    {{- end }}
  {{- end }}
{{- end }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if not $authEnabled }}
  {{- $_ := set $annotations "bomhort.dev/security-warning" "API gateway authentication is disabled; direct API paths may expose SBOM and vulnerability data." }}
{{- else if and $uiIngress (not .Values.ingress.externalAuth.enabled) }}
  {{- $_ := set $annotations "bomhort.dev/security-warning" "The public UI proxies anonymous reads with the gateway service token; configure external user authentication before exposing this UI path." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: ingress
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- if .serviceSuffix }}
                name: {{ $.Release.Name }}-{{ .serviceSuffix }}
                {{- else }}
                name: {{ $.Release.Name }}-api-gateway
                {{- end }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}

