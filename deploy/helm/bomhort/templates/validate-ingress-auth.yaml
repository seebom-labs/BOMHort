{{- /*
Security validation for ingress and authentication.
Warns or fails when Ingress is enabled but API gateway authentication is disabled,
preventing unintended public exposure of SBOMs and vulnerability data.
*/ -}}
{{- if .Values.ingress.enabled }}
  {{- $authEnabled := false }}
  {{- if .Values.apiGateway }}
    {{- if .Values.apiGateway.auth }}
      {{- if .Values.apiGateway.auth.enabled }}
        {{- $authEnabled = true }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- if not $authEnabled }}
    {{- if .Values.ingress.requireAuth }}
      {{- fail "\n[SECURITY ERROR] ingress.enabled=true but apiGateway.auth.enabled=false while ingress.requireAuth=true. Refusing to deploy publicly exposed unauthenticated API." }}
    {{- else }}
      {{- /*
      Notice / Warning rendered during template evaluation or helm template inspection.
      */ -}}
      {{- $warning := "[SECURITY WARNING] Ingress is enabled but apiGateway.auth.enabled is false! SBOM data, packages, and vulnerability reports will be publicly accessible without authentication." }}
    {{- end }}
  {{- end }}
{{- end }}
