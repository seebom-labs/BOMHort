apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-parsing-worker
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: parsing-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-parsing-worker-claim-lock
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: parsing-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-parsing-worker-claim-lock
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: parsing-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-parsing-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-parsing-worker-claim-lock
{{- if .Values.apiGateway.dedupByImageDigest }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-api-gateway-image-dedup-lock
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-api-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-parsing-worker-claim-lock
{{- end }}
