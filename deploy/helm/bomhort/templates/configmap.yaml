apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  CLICKHOUSE_HOST: {{ .Values.clickhouse.host | quote }}
  CLICKHOUSE_PORT: {{ .Values.clickhouse.port | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  CLICKHOUSE_USER: {{ .Values.clickhouse.user | quote }}
  SBOM_DIR: {{ .Values.sbomSource.mountPath | quote }}
  {{- with .Values.ownership }}
  CLUSTER_NAME: {{ .cluster | default "" | quote }}
  NAMESPACE: {{ .namespace | default "" | quote }}
  PROJECT: {{ .project | default "" | quote }}
  INGEST_PATH_LAYOUT: {{ .pathLayout | default "" | quote }}
  {{- end }}
  {{- /*
    Tags (#357) are a list in values but a comma-separated string in the
    environment, because a ConfigMap value is always a scalar. join here
    rather than indexed TAGS_0/TAGS_1 keys: the backend parses one string,
    and numbered keys would make "unset" and "empty list" indistinguishable.
  */}}
  TAGS: {{ join "," .Values.ownership.tags | quote }}
  API_PORT: {{ .Values.apiGateway.port | quote }}
  WORKER_BATCH_SIZE: {{ .Values.parsingWorker.batchSize | quote }}
  SKIP_OSV: {{ .Values.parsingWorker.skipOSV | quote }}
  SKIP_GITHUB_RESOLVE: {{ .Values.parsingWorker.skipGitHubResolve | quote }}
  SKIP_NPM_RESOLVE: {{ .Values.parsingWorker.skipNPMResolve | default false | quote }}
  SKIP_NUGET_RESOLVE: {{ .Values.parsingWorker.skipNuGetResolve | default false | quote }}
  SBOM_LIMIT: {{ .Values.ingestionWatcher.sbomLimit | quote }}
  EXCEPTIONS_FILE: {{ .Values.licenseExceptions.mountPath | quote }}
  LICENSE_POLICY_FILE: {{ .Values.licensePolicy.mountPath | quote }}
  {{- with .Values.originalStore }}
  ORIGINAL_STORE_BACKEND: {{ .backend | default "auto" | quote }}
  {{- if .s3.bucket }}
  ORIGINAL_STORE_S3_BUCKET: {{ .s3.bucket | quote }}
  {{- end }}
  ORIGINAL_STORE_S3_PREFIX: {{ .s3.prefix | default "_bomhort/originals/" | quote }}
  {{- if .fs.enabled }}
  ORIGINAL_STORE_FS_PATH: {{ .fs.mountPath | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.s3.buckets }}
  {{- if kindIs "string" .Values.s3.buckets }}
  S3_BUCKETS: {{ .Values.s3.buckets | quote }}
  {{- else }}
  S3_BUCKETS: {{ .Values.s3.buckets | toJson | quote }}
  {{- end }}
  {{- end }}

