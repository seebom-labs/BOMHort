apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bomhort
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bomhort
        app.kubernetes.io/component: api-gateway
        {{- if not .Values.gitSync.enabled }}
        bomhort.io/sbom-volume: "true"
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.gitSync.enabled }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: bomhort.io/sbom-volume
                    operator: Exists
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/api-gateway:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          {{- $queryLimits := list }}
          {{- range $key, $env := dict "maxExecutionTime" "CLICKHOUSE_MAX_EXECUTION_TIME" "maxMemoryUsage" "CLICKHOUSE_MAX_MEMORY_USAGE" "maxThreads" "CLICKHOUSE_MAX_THREADS" }}
          {{- $v := index ($.Values.apiGateway.queryLimits | default dict) $key }}
          {{- if not (or (kindIs "invalid" $v) (kindIs "float64" $v) (kindIs "int" $v) (kindIs "int64" $v)) }}
          {{- fail (printf "apiGateway.queryLimits.%s must be a number (got %v); maxMemoryUsage is in bytes" $key $v) }}
          {{- end }}
          {{- if and (not (kindIs "invalid" $v)) (lt (int64 $v) 0) }}
          {{- fail (printf "apiGateway.queryLimits.%s must not be negative (0 = unset)" $key) }}
          {{- end }}
          {{- if and (not (kindIs "invalid" $v)) (gt (int64 $v) 0) }}
          {{- $queryLimits = append $queryLimits (dict "name" $env "value" (int64 $v | toString)) }}
          {{- end }}
          {{- end }}
          {{- $exceptionsEnv := include "bomhort.licenseExceptions.env" . }}
          {{- if or .Values.clickhouse.userPasswordSecret.enabled .Values.s3.credentialsSecret.enabled .Values.apiGateway.auth.enabled .Values.apiGateway.maxUploadSizeMB $queryLimits $exceptionsEnv }}
          env:
            {{- if .Values.clickhouse.userPasswordSecret.enabled }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.userPasswordSecret.secretName }}
                  key: {{ .Values.clickhouse.userPasswordSecret.key }}
            {{- end }}
            {{- if .Values.s3.credentialsSecret.enabled }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecret.secretName }}
                  key: {{ .Values.s3.credentialsSecret.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecret.secretName }}
                  key: {{ .Values.s3.credentialsSecret.secretKeyKey }}
            {{- end }}
            {{- if .Values.apiGateway.auth.enabled }}
            - name: AUTH_ENABLED
              value: "true"
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.apiGateway.auth.existingSecret.enabled }}
                  name: {{ .Values.apiGateway.auth.existingSecret.secretName }}
                  key: {{ .Values.apiGateway.auth.existingSecret.serviceTokenKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-api-auth
                  key: SERVICE_TOKEN
                  {{- end }}
                  optional: true
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.apiGateway.auth.existingSecret.enabled }}
                  name: {{ .Values.apiGateway.auth.existingSecret.secretName }}
                  key: {{ .Values.apiGateway.auth.existingSecret.apiKeysKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-api-auth
                  key: API_KEYS
                  {{- end }}
                  optional: true
            - name: API_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  {{- if .Values.apiGateway.auth.existingSecret.enabled }}
                  name: {{ .Values.apiGateway.auth.existingSecret.secretName }}
                  key: {{ .Values.apiGateway.auth.existingSecret.apiKeysJsonKey | default "API_KEYS_JSON" }}
                  {{- else }}
                  name: {{ .Release.Name }}-api-auth
                  key: API_KEYS_JSON
                  {{- end }}
                  optional: true
            {{- end }}
            {{- if .Values.apiGateway.maxUploadSizeMB }}
            - name: MAX_UPLOAD_SIZE_MB
              value: {{ .Values.apiGateway.maxUploadSizeMB | quote }}
            {{- end }}
            {{- range $queryLimits }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- with $exceptionsEnv }}{{ . | trim | nindent 12 }}{{ end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          volumeMounts:
            - name: sbom-data
              mountPath: {{ .Values.sbomSource.mountPath }}
              readOnly: {{ not .Values.sbomSource.writable }}
            {{- /* No rollout checksum: the pods re-read the mounted
                 directory and re-check stored results themselves. */}}
            {{- with include "bomhort.licenseExceptions.volumeMount" . }}{{ . | trim | nindent 12 }}{{ end }}
            {{- if .Values.licensePolicy.enabled }}
            - name: license-policy
              mountPath: {{ .Values.licensePolicy.mountPath }}
              subPath: license-policy.json
              readOnly: true
            {{- end }}
            {{- if (.Values.projectGroups | default dict).enabled }}
            # A directory, not a subPath: subPath mounts never see ConfigMap
            # updates, and the gateway re-reads the file when it changes.
            - name: project-groups
              mountPath: {{ .Values.projectGroups.mountDir | default "/data/config/project-groups" }}
              readOnly: true
            {{- end }}
            {{- if .Values.originalStore.fs.enabled }}
            - name: originals
              mountPath: {{ .Values.originalStore.fs.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: sbom-data
          {{- if .Values.gitSync.enabled }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.sbomSource.pvcName }}
          {{- end }}
        {{- if .Values.originalStore.fs.enabled }}
        - name: originals
          persistentVolumeClaim:
            claimName: {{ .Values.originalStore.fs.pvcName }}
        {{- end }}
        {{- with include "bomhort.licenseExceptions.volume" . }}{{ . | trim | nindent 8 }}{{ end }}
        {{- with .Values.licensePolicy }}
        {{- if .enabled }}
        - name: license-policy
          configMap:
            {{- if .existingConfigMap }}
            name: {{ .existingConfigMap }}
            items:
              - key: {{ .existingConfigMapKey | default "license-policy.json" }}
                path: license-policy.json
            {{- else }}
            name: {{ $.Release.Name }}-license-policy
            {{- end }}
        {{- end }}
        {{- end }}
        {{- if (.Values.projectGroups | default dict).enabled }}
        - name: project-groups
          configMap:
            name: {{ .Values.projectGroups.existingConfigMap | default (printf "%s-project-groups" .Release.Name) }}
            # A missing optional ConfigMap mounts an empty directory: no
            # explicit rules, the automatic grouping still applies.
            optional: true
        {{- end }}

