# BOMHort Helm values

# Container image defaults
image:
  registry: ghcr.io
  repository: seebom-labs/bomhort
  # Empty means "use the chart's appVersion", which release CI rewrites to the
  # git tag. Pinning a literal here is what shipped chart 0.6.0 pointing at
  # 0.1.3 images: CI bumps Chart.yaml on tag, never values.yaml, so the two
  # drifted apart silently for five releases. Set it only to pin a specific
  # image, e.g. for a hotfix or a local build.
  tag: ""
  pullPolicy: IfNotPresent

# GitHub API token for license resolution (optional, increases rate limit from 60 to 5000 req/h)
github:
  token: ""

# Ownership dimensions (#131 cluster, #138 namespace, #57 project)
#
# Three orthogonal, low-cardinality labels stamped onto every ingested row.
# All default to "" (= unassigned), which is also what every pre-existing row
# carries, so leaving them unset changes nothing.
#
#   cluster   - where is it deployed?        e.g. prod-eu          (1-50)
#   namespace - which tenant/team boundary?  e.g. payments         (10-500)
#   project   - what is it / who owns it?    e.g. payment-service  (50-5000)
#
# Precedence, highest first:
#   1. per-object: ?cluster=/?namespace=/?project= on POST /api/v1/sboms/upload
#   2. per-bucket: "cluster"/"namespace"/"project" inside an s3.buckets entry
#   3. these instance-wide defaults
#   4. pathLayout derivation (fills only what the above left empty)
ownership:
  cluster: ""
  namespace: ""
  project: ""
  # Default parent (product) for every ingested SBOM (PARENT). Usually left
  # empty: per-bucket "parent", the "parent" pathLayout token, ?parent= on
  # upload and the automatic grouping are the normal sources. See
  # projectGroups below.
  parent: ""

  # Grouping labels (#357), stamped onto every ingested SBOM.
  #
  # Tags answer "what kind of thing is this?", which the three dimensions
  # above cannot: they describe where a workload *runs*, so they are
  # structurally empty on a catalogue-style instance (a foundation collecting
  # SBOMs of its member projects has no cluster at all) — yet that instance
  # still needs to say "these 40 projects are sandbox applications".
  #
  # Tags group projects, they do not replace them. A project with three SBOMs
  # stays one project named after itself and merely carries the label:
  #
  #   ownership:
  #     project: ""            # left to per-bucket config or pathLayout
  #     tags: ["sandbox-applications"]
  #
  #   -> the listing shows k2s, cert-manager, ... each as its own project,
  #      all filterable by the "sandbox-applications" grouping.
  #
  # A list rather than a single value because the groupings are genuinely
  # many-to-many: one project can be a sandbox application *and* an
  # observability tool. Unlike cluster/namespace/project, tags from the
  # different levels are merged rather than overridden — a bucket adding
  # "sandbox-applications" does not contradict an instance-wide "platform".
  #
  # Normalised on ingestion (trimmed, lowercased, deduplicated), so casing
  # here is not load-bearing.
  tags: []

  # Derive the dimensions from where an SBOM sits in its source, instead of
  # (or on top of) the static values above. Empty = disabled, nothing is
  # derived. The layout maps positionally onto the leading path segments,
  # relative to the ingestion root (SBOM_DIR, or a bucket's configured
  # prefix); the filename itself is never consumed.
  #
  #   pathLayout: "cluster/namespace/project"
  #   prod-eu/payments/payment-service/app.spdx.json
  #     -> cluster=prod-eu namespace=payments project=payment-service
  #
  # Valid segments: cluster, namespace, project, "_" to skip a directory
  # level that carries no meaning, "tag" to turn a level into a grouping
  # label (may repeat; "tag/project" makes {parent}/{sub}/... a hierarchy),
  # and "file" as the last segment to take the project from the filename
  # minus extensions. A malformed layout fails at startup rather than
  # silently ingesting everything unlabelled.
  #
  # Explicit configuration always wins: derivation only fills dimensions that
  # are still empty. Override per bucket with "pathLayout" in an s3.buckets
  # entry.
  pathLayout: ""

# S3 bucket ingestion (default, recommended)
# Ingest SBOMs directly from S3-compatible buckets (AWS S3, MinIO, GCS).
# No PVC, git-sync, or seed job required. Streams object listings with pagination.
# The Parsing Workers fetch objects on-demand via s3:// URIs.
# Set s3.buckets to a JSON array of bucket configs. Leave empty to use volume-based alternatives.
s3:
  # JSON array of bucket configs. Injected as S3_BUCKETS env var.
  # Example: [{"name":"my-org-sboms","region":"us-east-1"},{"name":"platform-sboms","region":"us-east-1"}]
  #
  # Push-model uploads (POST /api/v1/sboms/upload, #135): mark exactly one
  # bucket "skipScan": true to designate it as the push target. skipScan
  # buckets are excluded from the ingestion-watcher's periodic ListObjects
  # scan — otherwise pushed objects would be rediscovered and re-enqueued
  # under a different dedup hash (S3 ETag vs. the SHA256 the upload endpoint
  # already used) — but remain reachable for GetObject/PutObject. If no
  # skipScan bucket is configured, the upload endpoint falls back to writing
  # under SBOM_DIR/pushed/ (see sbomSource.writable below).
  # Example with a push bucket:
  # [{"name":"my-org-sboms","region":"us-east-1"},{"name":"bomhort-pushed","region":"us-east-1","skipScan":true}]
  #
  # Per-bucket ownership and grouping: a bucket entry may carry "cluster",
  # "namespace", "project", "pathLayout" and "tags". This is the usual way to
  # label a catalogue instance, where each bucket holds one category of
  # projects:
  # [{"name":"sboms-sandbox","region":"us-east-1","tags":["sandbox-applications"],"pathLayout":"_/_/project"},
  #  {"name":"sboms-graduated","region":"us-east-1","tags":["graduated"],"pathLayout":"_/project"}]
  #
  # Note how "tags" and "project" do different jobs: pathLayout picks the real
  # project out of the key, while tags label what kind of project it is. The
  # listing then shows each project by name, filterable by grouping — rather
  # than collapsing a whole category into one entry named after its prefix.
  buckets: ""
  # Shared credentials (applied to all buckets without their own keys).
  # For public buckets, leave empty.
  accessKey: ""
  secretKey: ""
  # Reference an existing Kubernetes Secret for S3 credentials instead of
  # specifying them as plain values above. Works the same way as
  # clickhouse.userPasswordSecret.
  credentialsSecret:
    enabled: false
    secretName: ""
    accessKeyKey: "S3_ACCESS_KEY"   # key inside the Secret that holds the access key
    secretKeyKey: "S3_SECRET_KEY"   # key inside the Secret that holds the secret key

# ClickHouse (provisioned via ClickHouse Operator)
clickhouse:
  host: chi-bomhort-clickhouse-bomhort-cluster-0-0
  port: 9000
  database: bomhort
  user: default
  password: ""
  userPasswordSecret:
    enabled: false
    secretName: ""
    key: ""
  cluster:
    name: bomhort-cluster
    shardsCount: 1
    replicasCount: 1
  installation:
    podTemplate:
      containerImage: docker.io/clickhouse/clickhouse-server:24.8
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 1000m
          memory: 1Gi
    volumeClaimTemplate:
      dataStorage: 1Gi
      logStorage: 100Mi

# SBOM source via PVC (alternative to S3, for environments without S3 access)
sbomSource:
  pvcName: bomhort-sbom-data
  mountPath: /data/sboms
  storageSize: 1Gi
  # PVC access mode. Change to ReadWriteMany (needs a storage class that
  # supports it — e.g. EFS, Azure Files, most NFS-backed provisioners) if you
  # enable sbomSource.writable below AND run apiGateway.replicas > 1: the
  # default ReadWriteOnce only lets one pod mount the volume read-write at a
  # time, which would make push-model uploads fail on every replica but one.
  accessMode: ReadWriteOnce
  # Mount the API Gateway's sbom-data volume read-write instead of read-only.
  # Only needed so POST /api/v1/sboms/upload (#135) can fall back to writing
  # under SBOM_DIR/pushed/ when no S3 skipScan bucket is configured (see
  # s3.buckets above). Leave false (default) if uploads should go to S3, or
  # if the upload endpoint isn't used — a write-capable PVC mount is a
  # meaningfully larger blast radius than the read-only default, so this is
  # opt-in.
  writable: false

# Tier-2 fidelity capture (#256): keep the original SBOM bytes as ingested so
# every document can be reproduced byte-for-byte (download, enriched export,
# re-signing). ClickHouse only stores a reference + sha256; the bytes go to a
# blob store.
originalStore:
  # auto (default) | s3 | fs | none
  #   auto → s3 when s3.buckets is set, else fs when fs.enabled, else none.
  #   none disables capture — SBOMs ingested while disabled can never be
  #   recovered byte-for-byte later, so only use this deliberately.
  backend: auto
  s3:
    # Bucket to write to. Must be one of s3.buckets. Empty = first bucket
    # that is not a skipScan (push-upload) bucket.
    bucket: ""
    # Key prefix inside the bucket. Anything under "_bomhort/" is skipped by
    # the ingestion watcher, so originals are never re-ingested.
    prefix: "_bomhort/originals/"
  fs:
    # Filesystem backend for deployments without object storage. Creates a
    # PVC that is mounted read-write into the parsing workers and the API
    # gateway. With more than one replica of either, the storage class must
    # support ReadWriteMany.
    enabled: false
    pvcName: bomhort-originals
    mountPath: /data/originals
    storageSize: 10Gi
    accessMode: ReadWriteOnce
    storageClassName: ""

# Pod-level security context applied to the parsing-worker and api-gateway
# pods. The images run as user "nobody" (uid/gid 65534); a freshly provisioned
# PVC is usually root-owned, so without fsGroup the workers cannot write
# originals (originalStore.fs) and the gateway cannot persist push uploads
# (sbomSource.writable). fsGroupChangePolicy: OnRootMismatch avoids a
# recursive chown on every pod start for large volumes.
podSecurityContext:
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch

# git-sync: alternative to S3 — pulls SBOMs from a Git repository into a PVC.
# Only suitable for small repos (< 1 GB). For large-scale ingestion, use S3 instead.
gitSync:
  enabled: true
  image: registry.k8s.io/git-sync/git-sync:v4.4.0
  repo: "https://github.com/your-org/sbom-repo.git"
  branch: main
  depth: 1          # shallow clone
  period: "6h"      # re-sync interval (sidecar mode)
  root: /data/sboms
  timeout: 120       # seconds for git clone/checkout (increase for large repos)
  # For private repos, mount a Secret with SSH key or token:
  # secretName: git-sync-credentials

# License exceptions (mounted as ConfigMap, read-only). No approvals by default.
licenseExceptions:
  enabled: true
  mountPath: /data/config/license-exceptions.json
  # YAML object or JSON string; both blanketExceptions and exceptions must be arrays.
  # Alternatively: --set-file licenseExceptions.custom=./my-exceptions.json
  # See examples/license-exceptions/ for an inactive example to adapt and review.
  # Changes trigger API/worker rollouts; re-process SBOMs to update stored results.
  custom: ""

# License policy – defines permissive/copyleft classification (ConfigMap, read-only)
licensePolicy:
  enabled: true
  mountPath: /data/config/license-policy.json
  # How compound SPDX expressions ("Apache-2.0 AND MIT", "MIT OR GPL-2.0-only")
  # are classified. Injected as LICENSE_EXPRESSION_MODE and overrides the
  # "expressionMode" field of the policy file.
  #   strict           – SPDX semantics: AND needs every operand permissive,
  #                      one copyleft operand makes the expression copyleft;
  #                      OR is permissive if any operand is. (default)
  #   permissive-wins  – AND is treated like OR: one permissive operand is
  #                      enough. For catalogues whose generators join a
  #                      package's licenses with AND regardless of meaning.
  #   off              – no expression evaluation; compound strings that are
  #                      not listed verbatim in the policy stay "unknown".
  # Leave empty to defer to the policy file / built-in default (strict).
  # Changing this only affects newly processed SBOMs; re-process to update
  # stored compliance results.
  expressionMode: ""

# Project groups – which parent (product) a project belongs to.
#
# The API groups projects under a parent automatically when the SBOMs say so
# unambiguously: by repository owner (any forge, GitLab subgroups and Azure
# DevOps included), the owner in a document name "owner/repo version", the
# namespace of the root package URL (maven groupId, npm scope, Go module
# owner), or the supplier. A shared owner with several top-level projects
# (e.g. kubernetes-sigs) groups nothing. This file assigns or overrides
# explicitly; it wins over every automatic rule.
#
# Mounted as a directory (no subPath), so an edited ConfigMap reaches the
# running API gateway without a restart and applies on the next request.
projectGroups:
  enabled: true
  mountDir: /data/config/project-groups
  # Name of a ConfigMap you manage yourself, holding a key
  # "project-groups.json". When set, groups below is ignored.
  existingConfigMap: ""
  # Evaluated in order; the first matching entry wins. Each entry needs
  # either a parent or standalone: true, and a non-empty match. Match values
  # are alternatives: projects and repos are globs ("*" spans "/"), owners and
  # suppliers compare exactly; all case-insensitive.
  #
  #   groups:
  #     - parent: argo
  #       match: { projects: ["argo-cd/*"] }
  #     - parent: Payments Platform
  #       match: { owners: ["com.acme.payments"], suppliers: ["ACME Corp"] }
  #     - standalone: true
  #       match: { owners: ["kubernetes-sigs"] }
  #       reason: shared org, the projects are unrelated
  groups: []

# Ingestion Watcher (CronJob)
ingestionWatcher:
  schedule: "0 */6 * * *"  # Every 6 hours
  sbomLimit: 0              # 0 = unlimited
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Parsing Worker (Deployment)
parsingWorker:
  replicas: 5
  batchSize: 50
  skipOSV: false            # Set to true for fast initial bulk load
  skipGitHubResolve: false  # Skip GitHub license resolution for unknown licenses
  skipNPMResolve: false     # Skip npm registry license resolution for unknown npm licenses
  skipNuGetResolve: false   # Skip NuGet license resolution for unknown NuGet licenses
  skipDepsDevResolve: false # Skip deps.dev license resolution for unknown package licenses
  skipPackagistResolve: false # Skip Packagist license resolution for unknown Composer licenses
  skipPyPIResolve: false    # Skip PyPI license resolution for unknown Python licenses
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# API Gateway (Deployment)
apiGateway:
  replicas: 2
  port: 8080
  # Max accepted body size for POST /api/v1/sboms/upload (#135), in MB.
  # Injected as MAX_UPLOAD_SIZE_MB; leave empty to use the binary's own
  # default (50). Note that the gateway's rate limit is request-based
  # (100 requests / 10s per IP), not byte-based — so this value also sets the
  # per-IP write budget. Lower it if the upload endpoint is exposed to
  # untrusted networks.
  maxUploadSizeMB: 50
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # API Authentication (opt-in, off by default).
  # When enabled, the API Gateway requires either a Bearer SERVICE_TOKEN
  # (X-Service-Token / Authorization header) or an X-API-Key from one of the
  # configured API_KEYS. The UI Deployment automatically receives the
  # SERVICE_TOKEN and injects it as the proxy Authorization header when the
  # browser does not supply its own — so the secret never leaves the cluster.
  auth:
    enabled: false
    # Inline secrets (created via the chart's Secret). Override via --set
    # for ad-hoc use; prefer existingSecret for production deployments.
    serviceToken: ""
    apiKeys: ""    # comma-separated list, e.g. "ci-key,monitoring-key"
    # Reference a pre-existing Kubernetes Secret instead of generating one.
    # The Secret must contain the keys named below (SERVICE_TOKEN / API_KEYS
    # by default). Same pattern as clickhouse.userPasswordSecret /
    # s3.credentialsSecret / github.tokenSecret.
    existingSecret:
      enabled: false
      secretName: ""
      serviceTokenKey: "SERVICE_TOKEN"
      apiKeysKey: "API_KEYS"

# Ingress (optional – exposes the API Gateway and/or UI externally)
# Works with any Ingress controller (Envoy Gateway, Contour, AWS ALB, etc.)
# For Gateway API support, use a dedicated Gateway/HTTPRoute instead.
ingress:
  enabled: false
  className: ""   # e.g. "envoy", "contour", "alb"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: []
    # - host: bomhort.example.com
    #   paths:
    #     - path: /api
    #       pathType: Prefix
    #       # serviceSuffix defaults to "api-gateway" if omitted
    #     - path: /
    #       pathType: Prefix
    #       serviceSuffix: ui
  tls: []
    # - secretName: bomhort-tls
    #   hosts:
    #     - bomhort.example.com

# UI (Deployment)
# Set ui.enabled to false for headless (API-only) deployments.
# This skips all UI resources (Deployment, Service, ConfigMaps) and reduces
# the resource footprint. All API endpoints remain fully functional.
ui:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Custom CSS theme – mount a custom-theme.css to override colors.
  # Edit the ConfigMap to rebrand the UI without rebuilding.
  customTheme:
    enabled: false
  # Site configuration – override brand name, dashboard texts, disclaimer etc.
  # All text fields support HTML. Edit via Helm values or kubectl edit configmap.
  siteConfig:
    enabled: false
    content:
      brandName: "BOMHort"
      pageTitle: "BOMHort"
      dashboard:
        title: "Dashboard"
        subtitle: "Software Bill of Materials — Governance Overview"
        description: '<strong>BOMHort</strong> autonomously ingests SPDX and CycloneDX SBOMs at scale, cross-references known vulnerabilities via the <a href="https://osv.dev" target="_blank" rel="noopener">OSV database</a>, evaluates license compliance against a configurable policy, and applies <a href="https://openvex.dev" target="_blank" rel="noopener">OpenVEX</a> statements to suppress non-applicable findings — giving you a single pane of glass for software supply-chain governance.'
        disclaimer: '<strong>Disclaimer:</strong> The data shown on this dashboard is provided on an "as-is" basis for informational purposes only. Vulnerability and license information is sourced from third-party databases (OSV, GitHub) and may be incomplete or delayed. BOMHort does not guarantee the accuracy, completeness, or timeliness of any data and is not a substitute for professional security audits or legal advice. Use at your own risk.'
      footer:
        enabled: false
        text: ""

# MCP Server (#399) — read-only Model Context Protocol tool surface over the
# REST API, so an AI agent can ask BOMHort questions.
#
# Disabled by default. Two things to understand before enabling it:
#
#   1. It is a *consumer* of the REST API, not a second database reader. It
#      needs no ClickHouse credentials; it needs to reach the API Gateway.
#   2. Its in-cluster transport is Streamable HTTP, which is a remote
#      tool-execution endpoint. The server therefore refuses to start unless
#      both `httpToken` and a non-wildcard `allowedOrigins` list are set.
#      That is not configurable strictness — an unauthenticated MCP endpoint
#      is an open door, and "*" re-opens the cross-site hole the pinned SDK
#      version closes (CVE-2026-33252).
#
# For a laptop client, do not deploy this at all: run the `mcp-server` binary
# (or its image) locally on the default stdio transport and point
# `apiBaseURL` at your instance. stdio needs no port, no token and no origin
# list, because nothing is listening.
#
# The tool surface is read-only by design and frozen for 1.0: list_projects,
# get_project, search_packages, list_vulnerabilities, get_sbom. There are no
# write tools, and BOMHort never calls an LLM itself.
mcp:
  enabled: false
  replicas: 1
  # "stdio" | "http". The in-cluster Deployment only makes sense with "http";
  # the default is kept at the binary's own default so that a values file that
  # merely flips `enabled` does not silently open a port.
  transport: http
  port: 8081
  # Bearer token clients must present (Authorization: Bearer / X-API-Key).
  # Required for transport=http. Prefer existingSecret in production.
  httpToken: ""
  existingSecret:
    enabled: false
    secretName: ""
    httpTokenKey: "MCP_HTTP_TOKEN"
  # Explicit Origin allow-list. Required for transport=http; "*" is rejected.
  # A CLI client sends no Origin at all and is unaffected by this list; it
  # exists to stop a browser page from driving the server.
  # Example: ["https://agent.example.com"]
  allowedOrigins: []
  # Where the API Gateway lives. Empty means the in-cluster Service of this
  # release, which is what you want unless the MCP server talks to a different
  # instance.
  apiBaseURL: ""
  # Credentials sent *to* the API Gateway. Leave empty to inherit
  # apiGateway.auth.serviceToken / apiKeys from the same Secret — the usual
  # case, since it is the same release.
  serviceToken: ""
  apiKey: ""
  # Per-upstream-request timeout in seconds.
  requestTimeoutSeconds: 30
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# CVE Refresher (CronJob) – checks all known PURLs for newly disclosed CVEs.
cveRefresher:
  enabled: true
  schedule: "0 2 * * *"    # Daily at 2 AM
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Seed Job (only used when gitSync.enabled=false)
# Clones an SBOM git repo into the PVC on first install.
seedJob:
  sbomRepo: "https://github.com/my-org/sboms.git"
  sbomBranch: main
  # License exceptions are configured via licenseExceptions.custom, not downloaded.

# Data Migration (one-time, from old seebom deployment to new bomhort deployment)
# Runs as a Helm post-upgrade hook. Uses ClickHouse remote() to copy all tables
# from the source instance (old namespace/host) to the target (this chart's ClickHouse).
# Set enabled: true and configure the source connection for the first deploy,
# then disable it once migration is confirmed.
dataMigration:
  enabled: false
  source:
    # FQDN of the old ClickHouse in the seebom namespace
    host: chi-seebom-clickhouse-seebom-cluster-0-0.seebom.svc.cluster.local
    port: 9000
    database: seebom
    user: default
    passwordSecret:
      secretName: clickhouse-password   # must exist in the bomhort namespace
      key: password
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# Set to false to keep Job resources after completion (for debugging, or better visibility in ArgoCD). By default, Jobs are cleaned up after 5 minutes to prevent clutter.
cleanBatchJobs: true
