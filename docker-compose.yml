# docker-compose.yml – Local development stack
# Usage: docker compose up -d
#
# Configure SBOM_SOURCE_DIR in .env to point at your SBOM repository.
# Default: ./sboms (bundled examples)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/init/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    environment:
      CLICKHOUSE_DB: bomhort
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: hand the originals volume to uid 65534 ("nobody", the user the
  # backend images run as). Named volumes are created root-owned, which would
  # make every ingestion fail with "permission denied" (#256).
  originals-init:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    command: ["sh", "-c", "chown 65534:65534 /data/originals && chmod 0755 /data/originals"]
    volumes:
      - originals_data:/data/originals
    restart: "no"
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api-gateway
    ports:
      - "8080:8080"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: bomhort
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      API_PORT: "8080"
      SBOM_DIR: /data/sboms
      # Ownership dimensions (#131 cluster, #138 namespace, #57 project).
      # All default to "" (unassigned). INGEST_PATH_LAYOUT opts into deriving
      # them from an SBOM's position in the source, e.g.
      # "cluster/namespace/project" for prod-eu/payments/svc/app.spdx.json.
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      NAMESPACE: ${NAMESPACE:-}
      PROJECT: ${PROJECT:-}
      INGEST_PATH_LAYOUT: ${INGEST_PATH_LAYOUT:-}
      # TAGS (#357) are deployment-neutral grouping labels applied to every
      # ingested document, e.g. TAGS=sandbox-applications. They group projects
      # without replacing them, which is what makes them work on catalogue
      # instances that have no cluster at all.
      TAGS: ${TAGS:-}
      EXCEPTIONS_FILE: /data/config/license-exceptions.json
      LICENSE_POLICY_FILE: /data/config/license-policy.json
      # API Authentication (off by default; set AUTH_ENABLED=true in .env to enable)
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      API_KEYS: ${API_KEYS:-}
      # Max body size for POST /api/v1/sboms/upload (requires AUTH_ENABLED=true)
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      # S3 bucket access (needed for SBOM download from S3 sources)
      S3_BUCKETS: ${S3_BUCKETS:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-}
      S3_USE_SSL: ${S3_USE_SSL:-}
      # Original SBOM bytes (#256): read side. auto → s3 when S3 is configured,
      # else the shared originals volume below.
      ORIGINAL_STORE_BACKEND: ${ORIGINAL_STORE_BACKEND:-auto}
      ORIGINAL_STORE_FS_PATH: /data/originals
    volumes:
      - ${SBOM_SOURCE_DIR:-./sboms}:/data/sboms:ro
      - ./sboms/license-exceptions.json:/data/config/license-exceptions.json:ro
      - ./sboms/license-policy.json:/data/config/license-policy.json:ro
      - originals_data:/data/originals:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      originals-init:
        condition: service_completed_successfully

  ingestion-watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ingestion-watcher
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: bomhort
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      SBOM_DIR: /data/sboms
      # Ownership dimensions (#131 cluster, #138 namespace, #57 project).
      # All default to "" (unassigned). INGEST_PATH_LAYOUT opts into deriving
      # them from an SBOM's position in the source, e.g.
      # "cluster/namespace/project" for prod-eu/payments/svc/app.spdx.json.
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      NAMESPACE: ${NAMESPACE:-}
      PROJECT: ${PROJECT:-}
      INGEST_PATH_LAYOUT: ${INGEST_PATH_LAYOUT:-}
      # TAGS (#357) are deployment-neutral grouping labels applied to every
      # ingested document, e.g. TAGS=sandbox-applications. They group projects
      # without replacing them, which is what makes them work on catalogue
      # instances that have no cluster at all.
      TAGS: ${TAGS:-}
      SBOM_LIMIT: ${SBOM_LIMIT:-0}
      # S3 bucket ingestion (optional – leave empty to use local files only)
      S3_BUCKETS: ${S3_BUCKETS:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-}
      S3_USE_SSL: ${S3_USE_SSL:-}
    volumes:
      - ${SBOM_SOURCE_DIR:-./sboms}:/data/sboms:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  parsing-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: parsing-worker
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: bomhort
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      SBOM_DIR: /data/sboms
      # Ownership dimensions (#131 cluster, #138 namespace, #57 project).
      # All default to "" (unassigned). INGEST_PATH_LAYOUT opts into deriving
      # them from an SBOM's position in the source, e.g.
      # "cluster/namespace/project" for prod-eu/payments/svc/app.spdx.json.
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      NAMESPACE: ${NAMESPACE:-}
      PROJECT: ${PROJECT:-}
      INGEST_PATH_LAYOUT: ${INGEST_PATH_LAYOUT:-}
      # TAGS (#357) are deployment-neutral grouping labels applied to every
      # ingested document, e.g. TAGS=sandbox-applications. They group projects
      # without replacing them, which is what makes them work on catalogue
      # instances that have no cluster at all.
      TAGS: ${TAGS:-}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
      SKIP_OSV: ${SKIP_OSV:-false}
      SKIP_GITHUB_RESOLVE: ${SKIP_GITHUB_RESOLVE:-false}
      SKIP_NPM_RESOLVE: ${SKIP_NPM_RESOLVE:-false}
      SKIP_NUGET_RESOLVE: ${SKIP_NUGET_RESOLVE:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      EXCEPTIONS_FILE: /data/config/license-exceptions.json
      LICENSE_POLICY_FILE: /data/config/license-policy.json
      # S3 bucket ingestion (worker needs same config to fetch S3 objects)
      S3_BUCKETS: ${S3_BUCKETS:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-}
      S3_USE_SSL: ${S3_USE_SSL:-}
      # Original SBOM bytes (#256): write side. Same backend selection as the
      # gateway; the worker needs the originals volume read-write.
      ORIGINAL_STORE_BACKEND: ${ORIGINAL_STORE_BACKEND:-auto}
      ORIGINAL_STORE_FS_PATH: /data/originals
    volumes:
      - ${SBOM_SOURCE_DIR:-./sboms}:/data/sboms:ro
      - ./sboms/license-exceptions.json:/data/config/license-exceptions.json:ro
      - ./sboms/license-policy.json:/data/config/license-policy.json:ro
      - originals_data:/data/originals
    depends_on:
      clickhouse:
        condition: service_healthy
      originals-init:
        condition: service_completed_successfully

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    environment:
      # When AUTH_ENABLED=true on the api-gateway, nginx injects this token
      # as the Authorization header on proxied /api/ calls. Empty = no header.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    volumes:
      - ${CUSTOM_THEME:-./ui/src/assets/custom-theme.example.css}:/usr/share/nginx/html/custom-theme.css:ro
      - ${UI_CONFIG:-./ui/public/ui-config.json}:/usr/share/nginx/html/ui-config.json:ro
    depends_on:
      - api-gateway

  cve-refresher:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: cve-refresher
    profiles: ["cve-refresh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: bomhort
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  originals_data:

