name: 'Upload SBOM to BOMHort'
description: 'Upload an existing SBOM file to BOMHort via the push API'
author: 'BOMHort maintainers'

inputs:
  url:
    description: 'BOMHort instance URL (e.g. https://bomhort.example.com)'
    required: true
  token:
    description: 'Service token or API key, selected by auth-type'
    required: true
  auth-type:
    description: 'Credential type: bearer for a service token, or api-key for an API key'
    required: false
    default: bearer
  sbom:
    description: 'Path or pattern to an existing SBOM file (e.g. build/sbom.spdx.json)'
    required: true
  project:
    description: 'Project name in BOMHort'
    required: false
    default: ${{ github.event.repository.name }}
  cluster:
    description: 'Deployment cluster name'
    required: false
  namespace:
    description: 'Deployment namespace'
    required: false
  parent:
    description: 'Parent product or group name'
    required: false
  tags:
    description: 'Comma-separated grouping tags'
    required: false
  source-repo:
    description: 'Source repository URL'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  source-ref:
    description: 'Source git commit SHA, tag, or ref'
    required: false
    default: ${{ github.sha }}
  wait:
    description: 'Wait for the ingestion job to complete (required for sarif and fail-on)'
    required: false
    default: 'false'
  wait-timeout:
    description: 'Maximum time in seconds to wait for ingestion to complete'
    required: false
    default: '300'
  fail-on:
    description: 'Fail if vulnerabilities meet or exceed severity (none, low, medium, high, critical)'
    required: false
    default: 'none'
  sarif:
    description: 'File path to download SARIF 2.1.0 report'
    required: false
    default: ''

outputs:
  status:
    description: 'Upload status (pending or duplicate)'
    value: ${{ steps.upload.outputs.status }}
  job-id:
    description: 'Ingestion job ID returned by BOMHort'
    value: ${{ steps.upload.outputs.job-id }}
  sha256-hash:
    description: 'SHA-256 digest of the uploaded SBOM'
    value: ${{ steps.upload.outputs.sha256-hash }}
  sbom-id:
    description: 'SBOM UUID in BOMHort'
    value: ${{ steps.upload.outputs.sbom-id }}
  vulnerabilities:
    description: 'JSON summary of vulnerability counts by severity'
    value: ${{ steps.upload.outputs.vulnerabilities }}
  url:
    description: 'Deep link to the SBOM detail in BOMHort'
    value: ${{ steps.upload.outputs.url }}

runs:
  using: 'composite'
  steps:
    - id: upload
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_AUTH_TYPE: ${{ inputs.auth-type }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_CLUSTER: ${{ inputs.cluster }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_PARENT: ${{ inputs.parent }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_SOURCE_REPO: ${{ inputs.source-repo }}
        INPUT_SOURCE_REF: ${{ inputs.source-ref }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF: ${{ inputs.sarif }}
      run: |
        "${{ github.action_path }}/upload.sh"
