name: Prow

# Chat-ops, labeling and merge automation via cncf/prow-github-actions.
# Configuration: .github/prow.yaml (label families, needs-* rules, merge gate).
# Review routing: OWNERS files (root and per component directory).
# Command reference for contributors: CONTRIBUTING.md ("Labels and Chat-Ops").
# Upstream docs: https://github.com/cncf/prow-github-actions/blob/main/docs/installing.md

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: fork pull requests get a write token, so they can be
  # labeled and merged too. This is safe because nothing here checks out or runs pull request
  # code; the reusable workflow only checks out cncf/prow-github-actions itself.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  # backstop for merges missed by the events above
  schedule:
    - cron: '0 * * * *'
  # label-sync: run once after installing, then whenever .github/prow.yaml changes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/prow.yaml]

# Read-only at the top level; each job grants what the reusable workflow needs. Its single job
# requests contents, issues, pull-requests, statuses and actions: write (labels, comments, the
# prow/lgtm commit status, merging, /retest), and a caller must grant at least that or the run
# fails. Job level rather than top level: OpenSSF Scorecard (Token-Permissions) scores any
# top-level contents/actions write as 0, while job-level grants under a read-only top level
# are what it asks for.
permissions:
  contents: read

# One run per comment (commands are never collapsed); per event+action for everything else,
# so a pending `synchronize` run can only be superseded by a newer `synchronize` run.
# Never cancel a run that may be merging.
concurrency:
  group: prow-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.comment.id || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prow:
    if: >-
      github.repository == 'seebom-labs/BOMHort' &&
      github.event_name != 'workflow_dispatch' && github.event_name != 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
    with:
      # Every /<key> below must have a matching `labels.<key>` section in .github/prow.yaml,
      # except the built-ins (/assign ... /ok-to-test). /remove-<key> forms come for free.
      prow-commands: >-
        /assign /unassign /cc /uncc /auto-cc
        /approve /lgtm /hold /close /reopen /lock /retitle /milestone /remove
        /label /help /good-first-issue /check-required-labels
        /retest /test /ok-to-test
        /priority /triage /kind
      jobs: lgtm

  label-sync:
    if: >-
      github.repository == 'seebom-labs/BOMHort' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
    with:
      jobs: label-sync

