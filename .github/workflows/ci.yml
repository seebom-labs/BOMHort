name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

  # Every read query is only type-checked by the unit tests above — never
  # planned. Two 500-on-every-request regressions shipped that way (SBOM detail
  # #332/#347, scoped-VEX join #350/#351, cluster listing "FINAL AS s"), each
  # caught only by running the stack by hand. This job applies the migrations
  # to a real ClickHouse and executes every query once.
  query-smoke:
    name: Query smoke test (ClickHouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.12@sha256:a65ca89ddbe8e04a05036dd7d7110a203256293b407b9359130ed5e4333f45ff
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_DB: bomhort
          CLICKHOUSE_USER: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Apply migrations
        working-directory: .
        run: |
          for f in db/migrations/*.up.sql; do
            echo "── $f"
            docker run --rm --network host \
              -v "$PWD/$f:/m.sql:ro" \
              clickhouse/clickhouse-server:24.12 \
              clickhouse-client --host 127.0.0.1 --database bomhort \
                --multiquery --queries-file /m.sql
          done

      - name: Run query smoke test
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: "9000"
          CLICKHOUSE_DATABASE: bomhort
        run: go test ./internal/clickhouse/ -count=1 -run 'TestQueriesExecute|TestSBOMDetailProjectionMatchesScan|TestSBOMVulnerabilitiesVEXJoin|TestClusterSBOMsQuery' -v

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration=production

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint deploy/helm/bomhort/

      - name: Test license exceptions templates
        run: python3 -B -m unittest discover -s deploy/helm/tests -v

  demo-sboms:
    name: Demo SBOM inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # examples/**/*.spdx.json is git-ignored so osv-scanner / Scorecard do
      # not report the deliberately vulnerable demo data as dependencies
      # (#394). A new fixture therefore needs `git add -f`, which is easy to
      # forget; this catches the fingerprint of that mistake — a README that
      # documents a file git does not have.
      - name: Every documented demo SBOM is tracked, every tracked one documented
        run: .github/scripts/check-demo-sboms.sh

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hack/cut-release.sh and hack/cherry-pick.sh against throwaway local git
      # repositories: branch cut, RC numbering, tags only on release branches,
      # backports. Nothing touches GitHub.
      - name: Test release scripts
        run: python3 -B -m unittest discover -s hack/tests -v

