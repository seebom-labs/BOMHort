name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

  # Every read query is only type-checked by the unit tests above — never
  # planned. Two 500-on-every-request regressions shipped that way (SBOM detail
  # #332/#347, scoped-VEX join #350/#351, cluster listing "FINAL AS s"), each
  # caught only by running the stack by hand. This job applies the migrations
  # to a real ClickHouse and executes every query once.
  #
  # Both versions run (#392): the floor is the LTS image the Helm chart ships,
  # the dev version is what docker-compose uses. A query that only works on the
  # newer one would otherwise pass CI and fail in production.
  # deploy/helm/tests/test_clickhouse_version.py keeps this matrix, the chart
  # and docker-compose.yml on the same pins.
  query-smoke:
    name: Query smoke test (ClickHouse ${{ matrix.clickhouse.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clickhouse:
          - name: floor
            image: docker.io/clickhouse/clickhouse-server:24.8.14.39@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
          - name: dev
            image: clickhouse/clickhouse-server:24.12@sha256:a65ca89ddbe8e04a05036dd7d7110a203256293b407b9359130ed5e4333f45ff
    defaults:
      run:
        working-directory: backend
    services:
      clickhouse:
        image: ${{ matrix.clickhouse.image }}
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_DB: bomhort
          CLICKHOUSE_USER: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Apply migrations
        working-directory: .
        env:
          CLICKHOUSE_IMAGE: ${{ matrix.clickhouse.image }}
        run: |
          for f in db/migrations/*.up.sql; do
            echo "── $f"
            docker run --rm --network host \
              -v "$PWD/$f:/m.sql:ro" \
              "$CLICKHOUSE_IMAGE" \
              clickhouse-client --host 127.0.0.1 --database bomhort \
                --multiquery --queries-file /m.sql
          done

      # Tests whose name contains "Seeded" insert their own fixtures; they
      # are selected by that marker, so a new one needs no edit here.
      - name: Run query smoke test
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: "9000"
          CLICKHOUSE_DATABASE: bomhort
        run: go test ./internal/clickhouse/ -count=1 -run 'TestQueriesExecute|TestSBOMDetailProjectionMatchesScan|TestSBOMVulnerabilitiesVEXJoin|TestClusterSBOMsQuery|TestProjectRowsUsePrimaryKey|TestQueryLimitsReachTheServer|TestFindingsCarryCVEAndAliases|TestAffectedProjectsByAnyAlias|TestVEXStatementsAndSearchCarryAliases|TestStreamVulnerabilitiesMatchesPagedListing|TestLicenseRecheckQueries|Seeded' -v

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration=production

  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-e2e-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Bundle size against baseline
        run: npx ng build --configuration=production && npm run e2e:bundle-size && npm run build:elements

      # Same manifests the release job publishes; a broken `files`/`main` fails here, not on release day.
      - name: npm publish dry-run
        run: for p in api-client elements react; do npm publish "./packages/$p" --dry-run; done

      # The suite runs against the real stack (nginx, /api proxy, CSP), seeded
      # with the demo fleet, so a broken proxy or header fails here, not in prod.
      - name: Start stack with demo fleet
        working-directory: .
        env:
          # License resolution asks GitHub; unauthenticated it parks jobs on the rate limit and the queue never drains.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The vulnerability pages need real OSV findings; .env.example disables them.
          sed 's/^SKIP_OSV=true/SKIP_OSV=false/' .env.example > .env
          make dev-up && make demo-fleet && make ui-e2e-wait

      - name: Run Playwright
        run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

      - name: Stack logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail=200

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint deploy/helm/bomhort/

      - name: Test license exceptions templates
        run: python3 -B -m unittest discover -s deploy/helm/tests -v

  demo-sboms:
    name: Demo SBOM inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # examples/**/*.spdx.json is git-ignored so osv-scanner / Scorecard do
      # not report the deliberately vulnerable demo data as dependencies
      # (#394). A new fixture therefore needs `git add -f`, which is easy to
      # forget; this catches the fingerprint of that mistake — a README that
      # documents a file git does not have.
      - name: Every documented demo SBOM is tracked, every tracked one documented
        run: .github/scripts/check-demo-sboms.sh

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hack/cut-release.sh and hack/cherry-pick.sh against throwaway local git
      # repositories: branch cut, RC numbering, tags only on release branches,
      # backports. Nothing touches GitHub.
      - name: Test release scripts
        run: python3 -B -m unittest discover -s hack/tests -v

