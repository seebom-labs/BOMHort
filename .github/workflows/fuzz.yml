name: ClusterFuzzLite (Fuzzing)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  schedule:
    - cron: '0 4 * * 6'  # Weekly on Saturday at 4 AM UTC

permissions:
  contents: read

jobs:
  fuzz:
    name: Go Fuzz Tests
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Run SPDX parser fuzz test
        run: go test ./internal/spdx/ -fuzz=FuzzParse -fuzztime=60s

      - name: Run VEX parser fuzz test
        run: go test ./internal/vex/ -fuzz=FuzzParse -fuzztime=60s


