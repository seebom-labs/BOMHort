# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Go backend dependencies
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps(go):"
    open-pull-requests-limit: 10

  # Angular frontend dependencies
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(npm):"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "zone.js"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Both are pinned by Angular's peer ranges, not by us. A major bump
      # ahead of Angular breaks `npm ci` with ERESOLVE (see #364: vitest 5
      # vs. @angular/build's peerOptional vitest@^4.0.8). They come along
      # with the Angular major instead.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions):"
    open-pull-requests-limit: 5

  # Docker base images (backend and ui)
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker):"
    open-pull-requests-limit: 5

  # Hugo docs site dependencies
  - package-ecosystem: "gomod"
    directory: "/docs"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "deps(docs):"
    open-pull-requests-limit: 5

  # Hugo docs site PostCSS toolchain (docs/package-lock.json). Only covered
  # by gomod before, so advisories in postcss/browserslist/nanoid sat
  # unreported until someone ran `npm audit` by hand.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "deps(docs):"
    open-pull-requests-limit: 5

