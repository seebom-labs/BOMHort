# BOMHort – CNCF public instance
#
# Values for the public catalogue instance that ingests the SBOMs of CNCF
# projects from the foundation's object storage. Public, read-only, no auth.
#
# Usage:
#   helm upgrade --install bomhort deploy/helm/bomhort -n bomhort --create-namespace \
#     -f examples/kubernetes/values-cncf.yaml \
#     --set clickhouse.password=<PASSWORD> \
#     --set s3.accessKey=<KEY> --set s3.secretKey=<SECRET> \
#     --set github.token=<TOKEN> \
#     --set-file licenseExceptions.custom=./cncf-exceptions.json
#
# The exceptions file is produced from the foundation's registry:
#   curl -sSL https://raw.githubusercontent.com/cncf/foundation/main/license-exceptions/exceptions.json \
#     | python3 examples/license-exceptions/convert-cncf-exceptions.py - -o cncf-exceptions.json
# Review the reported prose package names before applying; see
# examples/license-exceptions/README.md.

# ─── Images ──────────────────────────────────────────────────────────────────
image:
  registry: ghcr.io
  repository: seebom-labs/bomhort
  pullPolicy: IfNotPresent

# ─── ClickHouse ──────────────────────────────────────────────────────────────
clickhouse:
  host: chi-bomhort-clickhouse-bomhort-cluster-0-0
  port: 9000
  database: bomhort
  user: default
  password: ""   # --set clickhouse.password=... or clickhouse.userPasswordSecret
  cluster:
    name: bomhort-cluster
    shardsCount: 1
    replicasCount: 2
  installation:
    podTemplate:
      containerImage: docker.io/clickhouse/clickhouse-server:24.8
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
    volumeClaimTemplate:
      dataStorage: 50Gi
      logStorage: 1Gi

# ─── GitHub ──────────────────────────────────────────────────────────────────
# Needed for license resolution of packages without a declared license and
# for the archived-repository check; unauthenticated is 60 req/h.
github:
  token: ""   # --set github.token=... or github.tokenSecret

# ─── Ownership ───────────────────────────────────────────────────────────────
# A catalogue instance: no cluster/namespace. Projects come from the object
# key via the per-bucket pathLayout below; the instance-wide tag says what
# every SBOM here is.
ownership:
  cluster: ""
  namespace: ""
  project: ""
  tags: ["cncf"]
  pathLayout: ""

# ─── S3 Bucket Ingestion ─────────────────────────────────────────────────────
# Oracle Cloud Object Storage (S3-compatible). Keys are laid out
# {project}/{version-or-file}, so "_/project" would skip a leading level;
# adjust pathLayout to the actual bucket layout before the first ingest —
# a wrong layout requires a full re-ingest to fix.
s3:
  buckets: '[{"name":"cncf-project-sboms","endpoint":"https://axtwf1hkrwcy.compat.objectstorage.us-sanjose-1.oraclecloud.com","region":"us-sanjose-1","usePathStyle":true,"useSSL":true,"pathLayout":"project"}]'
  accessKey: ""
  secretKey: ""
  # Recommended: reference an existing Secret instead of --set.
  # credentialsSecret:
  #   enabled: true
  #   secretName: bomhort-s3-credentials

gitSync:
  enabled: false

# Kept only as the PVC fallback; S3 above is the source of truth.
seedJob:
  sbomRepo: "https://github.com/cncf/sbom.git"
  sbomBranch: main

sbomSource:
  pvcName: bomhort-sbom-data
  mountPath: /data/sboms
  storageSize: 15Gi

# ─── License Config ─────────────────────────────────────────────────────────
# Classification: the chart's default policy is already the CNCF Allowed
# Third-Party License Policy, so no custom policy is needed.
licensePolicy:
  enabled: true
  mountPath: /data/config/license-policy.json
  # CNCF SBOMs are generated by many tools; several join a package's licenses
  # with AND regardless of whether the package is dual-licensed
  # ("Apache-2.0 AND BSD-3-Clause AND MIT"). Under strict semantics those
  # all-permissive expressions still pass, but "MIT AND GPL-2.0-only" from a
  # dual-licensed package would be reported as copyleft. permissive-wins
  # treats one permissive operand as sufficient, which matches how the
  # foundation reviews these packages.
  expressionMode: permissive-wins

# Approvals: the foundation's exception registry, converted (see header).
# Empty until --set-file supplies it; empty means "no approvals", never a
# silent download.
licenseExceptions:
  enabled: true
  mountPath: /data/config/license-exceptions.json
  custom: ""

# ─── Ingestion Watcher ──────────────────────────────────────────────────────
ingestionWatcher:
  schedule: "0 */6 * * *"
  sbomLimit: 0
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ─── Parsing Workers ────────────────────────────────────────────────────────
parsingWorker:
  replicas: 5
  batchSize: 50
  skipOSV: false
  skipGitHubResolve: false
  skipNPMResolve: false
  skipNuGetResolve: false
  skipDepsDevResolve: false
  skipPackagistResolve: false
  skipPyPIResolve: false
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1", memory: 1Gi }

# ─── API Gateway ────────────────────────────────────────────────────────────
apiGateway:
  replicas: 2
  port: 8080
  maxUploadSizeMB: 50
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  # Public read-only instance: no auth. The upload endpoint has no push
  # bucket configured and sbomSource.writable stays false, so POST uploads
  # are rejected at the storage layer.
  auth:
    enabled: false

# ─── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: ""   # set to the cluster's controller, e.g. "envoy"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sbom.cncf.io   # ← replace with the actual public hostname
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
          serviceSuffix: ui
  tls:
    - secretName: bomhort-cncf-tls
      hosts:
        - sbom.cncf.io

# ─── UI ─────────────────────────────────────────────────────────────────────
ui:
  enabled: true
  replicas: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  customTheme:
    enabled: false
  siteConfig:
    enabled: true
    content:
      brandName: "CNCF SBOM Catalogue"
      pageTitle: "CNCF SBOM Catalogue"
      dashboard:
        title: "CNCF Projects"
        subtitle: "Software Bill of Materials — CNCF project supply-chain overview"
        description: 'This instance ingests the SBOMs published by <a href="https://www.cncf.io/projects/" target="_blank" rel="noopener">CNCF projects</a>, cross-references known vulnerabilities via the <a href="https://osv.dev" target="_blank" rel="noopener">OSV database</a>, evaluates license compliance against the <a href="https://github.com/cncf/foundation/blob/main/policies-guidance/allowed-third-party-license-policy.md" target="_blank" rel="noopener">CNCF Allowed Third-Party License Policy</a> together with the foundation''s <a href="https://github.com/cncf/foundation/blob/main/license-exceptions/exceptions.json" target="_blank" rel="noopener">approved exceptions</a>, and applies <a href="https://openvex.dev" target="_blank" rel="noopener">OpenVEX</a> statements where projects publish them. Powered by <strong>BOMHort</strong>.'
        disclaimer: '<strong>Disclaimer:</strong> Data is provided "as-is" for informational purposes only. Vulnerability and license information is sourced from third-party databases (OSV, GitHub, package registries) and may be incomplete or delayed. Findings shown here are not a statement by the CNCF or by any project about exploitability or compliance, and are no substitute for a professional security audit or legal advice.'
      footer:
        enabled: true
        text: 'Operated for the <a href="https://www.cncf.io" target="_blank" rel="noopener">Cloud Native Computing Foundation</a>. Source: <a href="https://github.com/seebom-labs/seebom" target="_blank" rel="noopener">seebom-labs/seebom</a>.'

# ─── CVE Refresher ──────────────────────────────────────────────────────────
cveRefresher:
  enabled: true
  schedule: "0 2 * * *"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
